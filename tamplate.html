<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory App</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --sidebar-bg: linear-gradient(180deg, #111827, #030712, #0b0f19);
      --topbar-bg: #111827;
      --primary: #00b894;
      --primary-light: #d1f2eb;
      --secondary: #3498db;
      --text-dark: #f8fafc;
      --text-light: #f8fafc;
      --border-color: #1f2937;
      --card-bg: #111827;
      --hover-bg: #16a085;
      --active-nav-color: #38bdf8;
      --sidebar-w: 260px;
      --sidebar-w-collapsed: 80px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #030712, #090d16, #1e1b4b) !important;
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============================
       SIDEBAR
       ============================ */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar-bg) !important;
      color: var(--text-light);
      transition: width 0.3s ease, transform 0.3s ease;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 8px 0 30px rgba(0, 0, 0, 0.6),
                  inset -1px 0 0 rgba(255,255,255,0.02);
      z-index: 1000;
      border-right: 1px solid rgba(255, 255, 255, 0.03);
      -webkit-overflow-scrolling: touch;
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.3);
      border-radius: 3px;
    }

    .app-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 22px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #38bdf8 !important;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
      white-space: nowrap;
      overflow: hidden;
    }

    .app-title i {
      color: #00d2d3;
      filter: drop-shadow(0 2px 8px rgba(0,210,211,0.5));
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .nav {
      padding: 15px 12px 30px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 11px 14px;
      color: #94a3b8;
      text-decoration: none;
      font-family: 'Poppins', sans-serif;
      font-size: 0.92rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border-radius: 12px;
      white-space: nowrap;
      overflow: hidden;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
      transform: translateX(4px);
    }

    .nav-item.active {
      background: linear-gradient(145deg, #0284c7, #0369a1) !important;
      color: white !important;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4),
                  inset 1px 1px 2px rgba(255, 255, 255, 0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .nav-item i {
      width: 22px;
      min-width: 22px;
      margin-right: 12px;
      text-align: center;
      font-size: 1.05rem;
      transition: 0.3s;
      flex-shrink: 0;
    }

    .nav-item.active i {
      color: #ffffff !important;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)) !important;
    }

    /* ---- Per-item icon colours (safer than nth-child) ---- */
    .nav-item.ic-dashboard   i { color: #ff7675; filter: drop-shadow(0 0 4px rgba(255,118,117,0.6)); }
    .nav-item.ic-inventory   i { color: #ffeaa7; filter: drop-shadow(0 0 4px rgba(255,234,167,0.6)); }
    .nav-item.ic-suppliers   i { color: #fd79a8; filter: drop-shadow(0 0 4px rgba(253,121,168,0.6)); }
    .nav-item.ic-customers   i { color: #a29bfe; filter: drop-shadow(0 0 4px rgba(162,155,254,0.6)); }
    .nav-item.ic-purchases   i { color: #74b9ff; filter: drop-shadow(0 0 4px rgba(116,185,255,0.6)); }
    .nav-item.ic-sales       i { color: #00b894; filter: drop-shadow(0 0 4px rgba(0,184,148,0.6)); }
    .nav-item.ic-order       i { color: #00cec9; filter: drop-shadow(0 0 4px rgba(0,206,201,0.6)); }
    .nav-item.ic-expenses    i { color: #2ecc71; filter: drop-shadow(0 0 4px rgba(46,204,113,0.6)); }
    .nav-item.ic-capital     i { color: #f1c40f; filter: drop-shadow(0 0 4px rgba(241,196,15,0.6)); }
    .nav-item.ic-reports     i { color: #e67e22; filter: drop-shadow(0 0 4px rgba(230,126,34,0.6)); }
    .nav-item.ic-employee    i { color: #95a5a6; filter: drop-shadow(0 0 4px rgba(149,165,166,0.6)); }
    .nav-item.ic-task        i { color: #bdc3c7; filter: drop-shadow(0 0 4px rgba(189,195,199,0.6)); }
    .nav-item.ic-users       i { color: #ff6b6b; filter: drop-shadow(0 0 4px rgba(255,107,107,0.6)); }
    .nav-item.ic-settings    i { color: #a29bfe; filter: drop-shadow(0 0 4px rgba(162,155,254,0.6)); }
    .nav-item.ic-logout      i { color: #ff6b6b; filter: drop-shadow(0 0 4px rgba(255,107,107,0.6)); }

    /* Active state overrides every icon colour */
    .nav-item.active i { color: #ffffff !important; }

    /* ============================
       MAIN CONTENT
       ============================ */
    .main-content {
      margin-left: var(--sidebar-w);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: margin-left 0.3s ease;
      width: calc(100% - var(--sidebar-w));
    }

    .top-bar {
      background: var(--topbar-bg) !important;
      padding: 15px 25px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 0;
      z-index: 999;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    /* Mobile hamburger */
    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      margin-right: auto;
      transition: 0.2s;
    }
    .menu-toggle:hover { color: #38bdf8; background: rgba(56,189,248,0.08); }

    .top-bar-links {
      display: flex;
      align-items: center;
    }

    .top-bar-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1f2937, #111827) !important;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.4),
                  inset 1px 1px 2px rgba(255,255,255,0.05);
      margin-left: 14px;
      color: #94a3b8;
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.03);
      text-decoration: none;
    }

    .top-bar-links a:hover {
      background: linear-gradient(145deg, #38bdf8, #0284c7) !important;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.4);
    }

    .top-bar-links a:active { transform: translateY(1px); }

    .content {
      padding: 30px;
      flex: 1;
      overflow-x: auto;
    }

    /* ============================
       CONTENT TABLES (kept from original)
       ============================ */
    .content table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }
    .content th {
      background: #1e3a5f !important;
      color: #38bdf8 !important;
      padding: 7px;
      border-radius: 12px;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.4);
      font-weight: 700;
      border: none;
    }
    .content td {
      padding: 6px;
      background: #1f2937 !important;
      color: #ffffff !important;
      border-radius: 14px;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      font-weight: 600;
      border: none;
    }
    .content tr:hover td {
      transform: translateY(-2px);
      background: #38a169 !important;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
    }

    /* ============================
       OVERLAY (mobile)
       ============================ */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(2px);
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .sidebar-overlay.show {
      display: block;
      opacity: 1;
    }

    /* ============================
       RESPONSIVE
       ============================ */
    /* Tablet – collapse to icon-only */
    @media (max-width: 992px) and (min-width: 769px) {
      .sidebar { width: var(--sidebar-w-collapsed); }
      .sidebar .app-title span,
      .sidebar .nav-item span { display: none; }
      .sidebar .app-title {
        justify-content: center;
        padding: 22px 10px;
      }
      .sidebar .nav-item {
        justify-content: center;
        padding: 12px 10px;
      }
      .sidebar .nav-item i { margin-right: 0; }

      .main-content {
        margin-left: var(--sidebar-w-collapsed);
        width: calc(100% - var(--sidebar-w-collapsed));
      }
    }

    /* Mobile – slide in/out */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        width: var(--sidebar-w);
        box-shadow: 8px 0 40px rgba(0, 0, 0, 0.8);
      }
      .sidebar.open { transform: translateX(0); }

      .main-content {
        margin-left: 0 !important;
        width: 100% !important;
      }

      .menu-toggle { display: inline-flex; }

      .content { padding: 18px 12px; }
      .top-bar { padding: 12px 16px; }
      .top-bar-links a { width: 36px; height: 36px; margin-left: 8px; }
    }

    @media (max-width: 480px) {
      .content { padding: 12px 8px; }
      .app-title { font-size: 1rem; }
    }

    /* ============================
       LOGOUT POPUP (kept)
       ============================ */
    .logout-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(145deg, #111827, #030712);
      border: 1px solid #1f2937;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      z-index: 10000;
      font-family: 'Roboto', sans-serif;
      color: #ffffff;
      text-align: center;
    }
    .logout-popup p {
      margin-bottom: 18px;
      font-weight: 600;
      color: #38bdf8;
    }
    .logout-popup button {
      background: linear-gradient(145deg, #0284c7, #0369a1);
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
    }
    .logout-popup button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar" id="appSidebar">
    <h1 class="app-title">
      <i class="fas fa-warehouse"></i>
      <span>Inventory Management</span>
    </h1>

    <nav class="nav">
      <a href="<?= getScriptUrl() ?>?page=dashboard"

      <a href="<?= getScriptUrl() ?>?page=purchases"
         class="nav-item ic-purchases <?= currentPage === 'purchases' ? 'active' : '' ?>">
        <i class="fas fa-file-invoice-dollar"></i><span>Purchases</span>
      </a>

      <a href="<?= getScriptUrl() ?>?page=sales"
         class="nav-item ic-sales <?= currentPage === 'sales' ? 'active' : '' ?>">

      </a>

      <a href="<?= getScriptUrl() ?>?page=order"
         class="nav-item ic-order <?= currentPage === 'order' ? 'active' : '' ?>">
        <i class="fas fa-shopping-bag"></i><span>Order</span>
      </a>

      <a href="<?= getScriptUrl() ?>?page=expenses"
         class="nav-item ic-expenses <?= currentPage === 'expenses' ? 'active' : '' ?>">
        <i class="fas fa-money-bill-wave"></i><span>Expenses</span>

         class="nav-item ic-capital <?= currentPage === 'capital' ? 'active' : '' ?>">

      <a href="<?= getScriptUrl() ?>?page=employee"
         class="nav-item ic-employee <?= currentPage === 'employee' ? 'active' : '' ?>">

      </a>

      <a href="<?= getScriptUrl() ?>?page=task"
         class="nav-item ic-task <?= currentPage === 'task' ? 'active' : '' ?>">

  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ===================== MAIN ===================== -->
  <div class="main-content">
    <div class="top-bar">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <div class="top-bar-links">
        <a href="#"><i class="fas fa-bell"></i></a>
        <a href="#"><i class="fas fa-cog"></i></a>
        <a href="#"><i class="fas fa-user"></i></a>
      </div>
    </div>

    <div class="content">
      <?!= include(contentTemplate + '.html') ?>
    </div>
  </div>

  <!-- ===================== SCRIPT ===================== -->
  <script>
    /* ---------- Mobile sidebar toggle ---------- */
    (function () {
      var sidebar  = document.getElementById('appSidebar');
      var overlay  = document.getElementById('sidebarOverlay');
      var toggle   = document.getElementById('menuToggle');

      function openSidebar() {
        sidebar.classList.add('open');
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
      }
      function closeSidebar() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
        document.body.style.overflow = '';
      }

      if (toggle) {
        toggle.addEventListener('click', function () {
          if (sidebar.classList.contains('open')) closeSidebar();
          else openSidebar();
        });
      }
      if (overlay) overlay.addEventListener('click', closeSidebar);

      /* Close sidebar when a nav link is tapped on mobile */
      document.querySelectorAll('.sidebar .nav-item').forEach(function (a) {
        a.addEventListener('click', function () {
          if (window.innerWidth <= 768) closeSidebar();
        });
      });

      /* Close on resize back to desktop */
      window.addEventListener('resize', function () {
        if (window.innerWidth > 768) closeSidebar();
      });
    })();

    /* ---------- Logout popup ---------- */
    (function () {
      var logoutLink = document.getElementById('logout-link');
      if (!logoutLink) return;

      logoutLink.addEventListener('click', function (event) {
        event.preventDefault();

        var messageBox = document.createElement('div');
        messageBox.className = 'logout-popup';
        messageBox.innerHTML =
          '<p>Logout functionality to be implemented!</p>' +
          '<button type="button">OK</button>';

        messageBox.querySelector('button').addEventListener('click', function () {
          messageBox.remove();
        });

        document.body.appendChild(messageBox);
      });
    })();
  </script>

</body>
</html>
